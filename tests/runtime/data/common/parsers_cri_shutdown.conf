# Test-only parsers used by the in_tail shutdown regression test.
#
# The multiline engine flushes buffered groups on every timer tick and the
# built-in "cri" parser uses the default 4 second timeout. The shutdown test
# needs the pending fragment to stay buffered until the engine is stopped, so
# this parser mirrors the CRI semantics with a 60 second flush timeout.

[PARSER]
    Name        cri_test
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<tag>F|P) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Skip_Empty_Values false

[MULTILINE_PARSER]
    Name          cri_test_ml
    Type          eq
    Match_String  F
    Flush_Timeout 60000
    Key_Content   log
    Key_Pattern   tag
    Key_Group     stream
    Parser        cri_test
