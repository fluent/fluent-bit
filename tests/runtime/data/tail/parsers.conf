[PARSER]
    Name                     docker
    Format                   json
    Time_Key                 time
    Time_Format              %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name                     docker_multiline
    Format                   regex
    Regex                    (?<log>^{"log":"\d{4}-\d{2}-\d{2}.*)

[PARSER]
    Name                     docker_raw_line
    Format                   regex
    Regex                    ^(?<raw>.*)$

[PARSER]
    Name                     docker_decoders
    Format                   json
    Decode_Field_As          json log
