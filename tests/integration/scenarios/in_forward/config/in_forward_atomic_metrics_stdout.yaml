service:
  flush: 1
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: forward
      listen: 127.0.0.1
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      workers: 1
      processors:
        metrics:
          - name: content_modifier
            context: otel_resource_attributes
            action: upsert
            key: retry_safe
            value: "true"

  outputs:
    - name: stdout
      match: test
