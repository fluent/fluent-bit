service:
  flush: 1
  log_level: debug
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: out_kafka
      dummy: '{"message":"blank headers key","headers":{"x-test":"value"}}'
      samples: 1

  outputs:
    - name: kafka
      match: out_kafka
      brokers: 127.0.0.1:${TEST_SUITE_KAFKA_PORT}
      topics: test
      format: json
      headers_key: "${TEST_HEADERS_KEY}"
      queue_full_retries: 1
      rdkafka.api.version.request: true
