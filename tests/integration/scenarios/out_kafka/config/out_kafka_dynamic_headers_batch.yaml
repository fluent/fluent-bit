service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: forward
      tag: out_kafka
      listen: 127.0.0.1
      port: ${TEST_SUITE_FORWARD_PORT}

  outputs:
    - name: kafka
      match: out_kafka
      brokers: 127.0.0.1:${TEST_SUITE_KAFKA_PORT}
      topics: test
      format: json
      headers_key: headers
      queue_full_retries: 1
      rdkafka.api.version.request: true
      rdkafka.queue.buffering.max.ms: 100
