service:
  flush: 4
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: prometheus_remote_write
      listen: 127.0.0.1
      port: ${PROM_RW_RECEIVER_PORT}
      uri: /write
      mem_buf_limit: 8KB
      http2: off
      http_server.workers: 4
      successful_response_code: 201

  outputs:
    - name: stdout
      match: "*"
