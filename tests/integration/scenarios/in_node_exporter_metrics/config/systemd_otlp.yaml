service:
  flush: 0.2
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: node_exporter_metrics
      tag: node_metrics
      metrics: systemd
      scrape_interval: 1
      systemd_service_restart_metrics: true
      systemd_unit_start_time_metrics: true
      systemd_include_service_task_metrics: true
      processors:
        metrics:
          - name: labels
            upsert: host test-host
  outputs:
    - name: opentelemetry
      match: node_metrics
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      metrics_uri: /v1/metrics
