service:
  flush: 1
  grace: 1
  log_level: debug
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      alias: single_pair_dummy
      tag: single.pair
      dummy: '{"message":"single pair record","topic":"topic1"}'
      samples: 1
      routes:
        logs:
          - name: single_pair_topic1
            condition:
              op: and
              rules:
                - field: $topic
                  op: eq
                  value: topic1
            to:
              outputs:
                - single_pair_stdout

  outputs:
    - name: stdout
      alias: single_pair_stdout
