service:
  flush: ${MULTILINE_SERVICE_FLUSH}
  grace: 10
  log_level: debug
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

multiline_parsers:
  - name: php_pid
    type: regex
    key_content: log
    key_group: pid
    flush_timeout: 60000
    rules:
      - state: start_state
        regex: '/^Default exception handler:/'
        next_state: cont
      - state: cont
        regex: '/^.+$/'
        next_state: cont

pipeline:
  inputs:
    - name: http
      tag: multiline.integration
      listen: 127.0.0.1
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}

  filters:
    - name: multiline
      match: multiline.integration
      multiline.key_content: log
      multiline.parser: php_pid
      buffer: on
      flush_ms: 60000

  outputs:
    - name: http
      match: multiline.integration
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      uri: /data
      format: json
      json_date_key: false
