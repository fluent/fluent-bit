service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: http
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      http_server.buffer_max_size: 8192
      http_server.buffer_chunk_size: 1024
  outputs:
    - name: null
      match: '*'
