service:
  flush: 12
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: http
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      mem_buf_limit: 8KB
      enable_health_endpoint: on
      http2: on
      workers: 4
      tls: on
      tls.crt_file: ${CERTIFICATE_TEST}
      tls.key_file: ${PRIVATE_KEY_TEST}

  outputs:
    - name: stdout
      match: '*'
