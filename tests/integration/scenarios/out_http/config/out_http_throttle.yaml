service:
  flush: 0.2
  scheduler.base: 1
  scheduler.cap: 1
  log_level: debug
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: out_http
      dummy: '{"message":"throttle me","source":"dummy"}'
      samples: 1

  outputs:
    - name: http
      match: out_http
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      uri: /data
      format: json
      json_date_key: false
      throttle: true
      throttle.base: 1
      throttle.cap: 1
      retry_limit: 1
