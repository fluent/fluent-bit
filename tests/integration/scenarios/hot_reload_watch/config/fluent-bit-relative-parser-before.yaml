service:
  flush: 1
  log_level: info
  parsers_file: relative-parser.conf
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  hot_reload: on

pipeline:
  inputs:
    - name: dummy
      tag: relative_parser
      samples: 1
      dummy: |
        {
          "message": "before"
        }

  filters:
    - name: parser
      match: relative_parser
      key_name: message
      parser: reload_test
      reserve_data: on

  outputs:
    - name: opentelemetry
      match: relative_parser
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      logs_uri: /v1/logs
      logs_body_key: $parsed
