[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File relative-parser.conf
    HTTP_Server  On
    HTTP_Listen  127.0.0.1
    HTTP_Port    ${FLUENT_BIT_HTTP_MONITORING_PORT}
    Hot_Reload   On

[INPUT]
    Name    dummy
    Tag     relative_parser
    Samples 1
    Dummy   {"message":"before"}

[FILTER]
    Name         parser
    Match        relative_parser
    Key_Name     message
    Parser       reload_test
    Reserve_Data On

[OUTPUT]
    Name          opentelemetry
    Match         relative_parser
    Host          127.0.0.1
    Port          ${TEST_SUITE_HTTP_PORT}
    Logs_URI      /v1/logs
    Logs_Body_Key $parsed
