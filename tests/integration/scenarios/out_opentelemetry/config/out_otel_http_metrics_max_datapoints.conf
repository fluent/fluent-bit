[SERVICE]
    flush        1
    log_level    info
    http_server  on
    http_port    ${FLUENT_BIT_HTTP_MONITORING_PORT}

[INPUT]
    name  opentelemetry
    port  ${FLUENT_BIT_TEST_LISTENER_PORT}

[OUTPUT]
    name                    opentelemetry
    match                   *
    host                    127.0.0.1
    port                    ${TEST_SUITE_HTTP_PORT}
    metrics_uri             /batched/metrics
    metrics_max_datapoints  4
