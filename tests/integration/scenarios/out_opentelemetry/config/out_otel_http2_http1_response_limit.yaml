service:
  flush: 1
  http_client.max_response_size: 64K
  http_client.max_header_size: 16K
  http_client.max_header_count: 50
  http_client.response_timeout: 10
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: response_limit
      samples: 1

  outputs:
    - name: opentelemetry
      match: response_limit
      host: localhost
      port: ${TEST_SUITE_HTTP_PORT}
      http2: on
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      tls.vhost: localhost
      tls.ca_file: ${CERTIFICATE_TEST}
      retry_limit: 1
