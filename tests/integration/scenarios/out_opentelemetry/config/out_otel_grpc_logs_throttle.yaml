service:
  flush: 1
  grace: 1
  scheduler.base: 1
  scheduler.cap: 1
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      samples: 1
      dummy: '{"message":"gRPC throttle"}'

  outputs:
    - name: opentelemetry
      match: "*"
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      http2: on
      grpc: on
      retry_limit: 2
      throttle: on
      throttle.base: 1
      throttle.cap: 1
