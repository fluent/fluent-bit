[SERVICE]
    flush        1
    log_level    info
    http_server  on
    http_port    ${FLUENT_BIT_HTTP_MONITORING_PORT}

[INPUT]
    name  opentelemetry
    port  ${FLUENT_BIT_TEST_LISTENER_PORT}

[OUTPUT]
    name                    opentelemetry
    match                   *
    host                    127.0.0.1
    port                    ${TEST_SUITE_HTTP_PORT}
    http2                   on
    grpc                    on
    grpc_metrics_uri        /batched.metrics.v1.Metrics/Export
    metrics_max_datapoints  4
