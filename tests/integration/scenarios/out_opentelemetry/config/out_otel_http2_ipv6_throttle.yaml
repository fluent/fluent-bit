service:
  flush: 1
  grace: 1
  scheduler.base: 1
  scheduler.cap: 1
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: ipv6_http2_throttle
      samples: 1
      dummy: '{"message":"HTTP/2 throttle"}'

  outputs:
    - name: opentelemetry
      match: ipv6_http2_throttle
      host: "::1"
      port: ${TEST_SUITE_HTTP_PORT}
      http2: on
      retry_limit: 2
      throttle: on
      throttle.base: 1
      throttle.cap: 1
