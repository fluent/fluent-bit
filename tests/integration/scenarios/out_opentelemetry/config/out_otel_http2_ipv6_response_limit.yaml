service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  http_client.max_response_size: 16K
  http_client.max_header_size: 1K
  http_client.max_wire_size: 256K

pipeline:
  inputs:
    - name: dummy
      tag: ipv6_http2
      samples: 1

  outputs:
    - name: opentelemetry
      match: ipv6_http2
      host: "::1"
      port: ${TEST_SUITE_HTTP_PORT}
      http2: on
      retry_limit: 1
