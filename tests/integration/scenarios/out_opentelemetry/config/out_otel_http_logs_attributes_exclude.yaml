service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      samples: 1
      dummy: |
        {
          "message": "body only",
          "TraceId": "63560bd4d8de74fae7d1e4160f2ee099",
          "SeverityText": "WARN",
          "thread": "main"
        }

  outputs:
    - name: opentelemetry
      match: "*"
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      logs_body_key: $message
      logs_body_key_attributes: on
      logs_body_key_attributes_exclude: TraceId,SeverityText
