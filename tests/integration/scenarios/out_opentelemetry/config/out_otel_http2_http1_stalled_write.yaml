service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  http_client.response_timeout: 2

pipeline:
  inputs:
    - name: opentelemetry
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      logs_max_size: 32M
      http_server.buffer_max_size: 32M

  outputs:
    - name: opentelemetry
      match: "*"
      host: localhost
      port: ${TEST_SUITE_HTTP_PORT}
      http2: on
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      tls.vhost: localhost
      tls.ca_file: ${CERTIFICATE_TEST}
      retry_limit: 1
