service:
  flush: 1
  grace: 1
  log_level: info
  scheduler.base: 1
  scheduler.cap: 1
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: out_es_partial_bulk_retry
      dummy: '{"message":"partial retry"}'
      copies: 3
      samples: 1

  outputs:
    - name: es
      match: out_es_partial_bulk_retry
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      index: fluent-bit
      suppress_type_name: on
      retry_limit: 2
