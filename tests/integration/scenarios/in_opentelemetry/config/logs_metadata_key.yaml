service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: opentelemetry
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      http2: off
      tls: off
      logs_metadata_key: custom_meta

  outputs:
    - name: stdout
      match: '*'
