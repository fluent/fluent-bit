service:
  flush: 0.2
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: opentelemetry
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      # Two frames contain eight 1.1 MB records after decompression.
      http_server.buffer_max_size: 16M
      http_server.workers: ${OTLP_TEST_HTTP_WORKERS}

  outputs:
    - name: opentelemetry
      match: '*'
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
