service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: opentelemetry
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      http2: off
      tls: off
      tag_from_uri: false
      tag: default_otel
      tag_key: $route_tag

  outputs:
    - name: stdout
      match: '*'

    - name: opentelemetry
      match: from_record
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
