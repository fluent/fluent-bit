service:
  flush: 0.2
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: opentelemetry
      listen: 127.0.0.1
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}

  filters:
    - name: expect
      match: "*"
      key_exists:
        - field1
        - field2
        - field3
        - field4
      action: result_key
      result_key: matched

  outputs:
    - name: opentelemetry
      match: "*"
      host: 127.0.0.1
      port: ${TEST_SUITE_HTTP_PORT}
      logs_uri: /v1/logs
