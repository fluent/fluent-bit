service:
  flush: 1
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  scheduler.base: 1
  scheduler.cap: 2

pipeline:
  inputs:
    - name: dummy
      tag: drops.ok
      dummy: '{"body":{"v":1}}'
      rate: 5
      samples: 3

    # Records without the payload key cannot be published
    - name: dummy
      tag: drops.bad
      dummy: '{"other":1}'
      rate: 5
      samples: 2

  outputs:
    - name: mqtt
      match: drops.*
      host: 127.0.0.1
      port: ${MQTT_BROKER_PORT}
      topic: drops
      payload_key: body
      retry_limit: 10
