service:
  flush: 1
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  scheduler.base: 1
  scheduler.cap: 2

pipeline:
  inputs:
    - name: dummy
      tag: status
      dummy: '{"state":"online"}'
      rate: 5
      samples: 3

  outputs:
    - name: mqtt
      match: status
      host: 127.0.0.1
      port: ${MQTT_BROKER_PORT}
      topic: gateway/status
      qos: 0
      retain: on
      format: msgpack
      json_date_key: false
      retry_limit: 10
