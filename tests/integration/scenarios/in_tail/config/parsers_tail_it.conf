[PARSER]
    Name   apache2
    Format regex
    Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^ ]*) +\S*)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>.*)")?$
    Time_Key time
    Time_Format %d/%b/%Y:%H:%M:%S %z

[MULTILINE_PARSER]
    name multiline-regex
    type regex
    flush_timeout 2000
    rule "start_state" "/^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\]/" "cont"
    rule "cont" "/^(?!\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\]).*/" "cont"

[PARSER]
    Name   docker
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name   iana_timezone
    Format regex
    Regex  ^(?<time>\d{2}/\d{2}/\d{4} \d{2}:\d{2}:\d{2}) (?<message>.*)$
    Time_Key time
    Time_Format %m/%d/%Y %H:%M:%S
    Time_Zone America/New_York

[PARSER]
    Name   docker_multiline
    Format regex
    Regex  (?<log>^{"log":"\d{4}-\d{2}-\d{2}.*)

# Used by the tail shutdown scenario: the multiline engine flushes buffered
# groups on every timer tick, so this CRI compatible parser pins the flush
# timeout to 60 seconds to keep the pending fragment buffered until shutdown.
[PARSER]
    Name        cri_test
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<tag>F|P) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Skip_Empty_Values false

[MULTILINE_PARSER]
    Name          cri_test_ml
    Type          eq
    Match_String  F
    Flush_Timeout 60000
    Key_Content   log
    Key_Pattern   tag
    Key_Group     stream
    Parser        cri_test
