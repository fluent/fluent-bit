service:
  flush: 12
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: splunk
      port: ${FLUENT_BIT_TEST_LISTENER_PORT}
      host: 0.0.0.0
      mem_buf_limit: 8KB
      http2: off
      net.keepalive: on
      tls: off

  outputs:
    - name: stdout
      match: '*'
