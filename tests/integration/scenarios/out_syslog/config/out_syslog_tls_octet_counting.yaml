service:
  flush: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: out_syslog
      dummy: '{"message":"multiline first\nsecond line 日本語"}'
      copies: 2
      samples: 1

  outputs:
    - name: syslog
      match: out_syslog
      host: 127.0.0.1
      port: ${SYSLOG_RECEIVER_PORT}
      mode: tls
      tls.verify: off
      syslog_format: rfc5424
      syslog_message_key: message
      syslog_framing: octet_counting
