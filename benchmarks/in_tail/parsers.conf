[PARSER]
    Name   json
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
[PARSER]
    Name   json_notime
    Format json
[PARSER]
    Name   rx
    Format regex
    Regex  ^(?<a>[^ ]+) (?<b>[^ ]+) (?<rest>.*)$
[PARSER]
    Name   rx_types
    Format regex
    Regex  ^line (?<n>\d+) (?<rest>.*)$
    Types  n:integer
[PARSER]
    Name   lf
    Format logfmt
