[SERVICE]
    Flush      5
    Log_Level  info

[INPUT]
    Name       forward
    Unix_Path  /var/run/fluent-bit/wire-logs.sock
    Unix_Perm  0660

[OUTPUT]
    Name                      s3
    Match                     wire.logs
    bucket                    example-wire-logs
    region                    us-east-1
    s3_key_format             /wire/%Y/%m/%d/%H/%M/%S/$UUID.parquet
    content_type              application/vnd.apache.parquet

    format                    parquet
    compression               zstd
    columnar_input_format     protobuf
    protobuf_data_key         wire_proto
    protobuf_descriptor_file  /etc/fluent-bit/wire-log.desc
    protobuf_message_type     com.example.logging.WireLog

    store_dir                 /var/lib/fluent-bit/s3
    total_file_size           100M
    upload_timeout            5m
