[SERVICE]
    Flush 1

[INPUT]
    Name  dummy
    Tag   manticore
    Dummy {"id":1,"message":"hello from Fluent Bit","status":200}

[OUTPUT]
    Name               manticore
    Match              manticore
    Host               127.0.0.1
    Port               9308
    Table              logs
    Action             insert
    Id_Key             id
    Stream_Chunk_Size  64K

    # For finite imports that must produce exactly one Manticore disk chunk:
    # Workers       1
    # Single_Chunk  On
    # Spool_Path    /var/lib/fluent-bit/manticore-logs.ndjson
