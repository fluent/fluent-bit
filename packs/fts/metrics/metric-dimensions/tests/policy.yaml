- name: non-gauge-passthrough
  input:
    resourceMetrics:
    - resource:
        attributes:
        - key: service.name
          value:
            stringValue: checkout
      scopeMetrics:
      - scope:
          name: fixture
        metrics:
        - name: queue_depth
          description: Synthetic fixture
          unit: '1'
          sum:
            dataPoints:
            - timeUnixNano: '1700000000000000000'
              asInt: '1'
              attributes:
              - key: zone
                value:
                  stringValue: a
            - timeUnixNano: '1700000000000000000'
              asInt: '2'
              attributes:
              - key: zone
                value:
                  stringValue: b
