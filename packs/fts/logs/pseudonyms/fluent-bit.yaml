service:
  flush: 1
  grace: 1
  parsers_file: parsers.conf
pipeline:
  inputs:
  - name: tail
    path: events.jsonl
    read_from_head: true
    parser: json
    processors:
      logs:
      - name: fts
        recipe_version: 1
        packs:
        - logs/pseudonyms/pack.json
        error_mode: drop
        recipe:
        - id: policy
          use: org.fluentbit.policy.pseudonyms/apply
          with:
            key_ref: email-v1
            tenant: tenant-a
        secret_refs:
          email-v1: FTS_PSEUDONYM_KEY_V1
        packages_dir: ${FTS_PACKAGES_DIR}
  outputs:
  - name: stdout
    match: '*'
    format: json_lines
