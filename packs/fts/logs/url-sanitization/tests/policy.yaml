fixture_version: 1
signal: logs
processor:
  name: fts
  packs:
  - ../pack.json
  recipe_version: 1
  error_mode: drop
  recipe:
  - id: policy
    use: org.fluentbit.policy.url-sanitization/apply
cases:
- name: remove-userinfo-query-fragment
  input:
  - body:
      url: https://alice:synthetic@example.test/orders?token=synthetic#private
  expected:
    records:
    - body:
        url: https://example.test/orders
    outcomes:
      kept: 1
      dropped: 0
      errors: 0
- name: preserve-path-control
  input:
  - body:
      url: http://example.test/health
  expected:
    records:
    - body:
        url: http://example.test/health
    outcomes:
      kept: 1
      dropped: 0
      errors: 0
- name: reject-ambiguous
  input:
  - body:
      url: not-a-url
  expected:
    records: []
    outcomes:
      kept: 0
      dropped: 1
      errors: 1
    error:
      step: policy
      class: invalid_parameter
- name: origin-form-query
  input:
  - body:
      url: /login?token=synthetic
  expected:
    records:
    - body:
        url: /login
    outcomes:
      kept: 1
      dropped: 0
      errors: 0
- name: origin-form-control
  input:
  - body:
      url: /health
  expected:
    records:
    - body:
        url: /health
    outcomes:
      kept: 1
      dropped: 0
      errors: 0
- name: origin-backslash
  input:
  - body:
      url: /\alice:secret@example.test
  expected:
    records: []
    outcomes:
      kept: 0
      dropped: 1
      errors: 1
    error:
      step: policy
      class: invalid_parameter
- name: invalid-port
  input:
  - body:
      url: https://alice:secret
  expected:
    records: []
    outcomes:
      kept: 0
      dropped: 1
      errors: 1
    error:
      step: policy
      class: invalid_parameter
- name: empty-authority
  input:
  - body:
      url: http:///path
  expected:
    records: []
    outcomes:
      kept: 0
      dropped: 1
      errors: 1
    error:
      step: policy
      class: invalid_parameter
- name: network-path
  input:
