service:
  flush: 1
  grace: 1
  parsers_file: parsers.conf
pipeline:
  inputs:
  - name: opentelemetry
    listen: 127.0.0.1
    port: 4318
    processors:
      logs:
      - name: fts
        packs:
        - logs/log-trace-correlation/pack.json
        recipe_version: 1
        error_mode: drop
        recipe:
        - id: policy
          use: org.fluentbit.policy.log-trace-correlation/apply
        packages_dir: ${FTS_PACKAGES_DIR}
  outputs:
  - name: stdout
    match: '*'
    format: json_lines
