service:
  flush: 1
  grace: 1
  parsers_file: parsers.conf
pipeline:
  inputs:
  - name: tail
    path: events.jsonl
    read_from_head: true
    parser: json
    processors:
      logs:
      - name: fts
        recipe_version: 1
        packs:
        - logs/stable-log-sampling/pack.json
        error_mode: keep
        recipe:
        - id: policy
          use: org.fluentbit.policy.stable-log-sampling/apply
        packages_dir: ${FTS_PACKAGES_DIR}
  outputs:
  - name: stdout
    match: '*'
    format: json_lines
