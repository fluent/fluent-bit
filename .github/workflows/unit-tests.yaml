name: Run unit tests
on:
  push:
    branches:
      - master
      - 3.2
      - 3.1
      - 3.0
      - 2.2
      - 2.1
      - 2.0
      - 1.9
      - 1.8
  pull_request:
    branches:
      - master
      - 5.1
      - 5.0
      - 4.2
      - 4.1
      - 4.0
      - 3.2
      - 3.1
      - 3.0
      - 2.2
      - 2.1
      - 2.0
      - 1.9
      - 1.8
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      build_jobs:
        description: 'Build parallelism override (empty uses detected CPUs, capped at 8)'
        type: string
        default: ''
      test_jobs:
        description: 'CTest parallelism override for Linux and macOS benchmarking'
        type: string
        default: ''

env:
  FLB_BUILD_JOBS: ${{ inputs.build_jobs }}
  FLB_TEST_JOBS: ${{ inputs.test_jobs }}

jobs:
  select-unit-tests:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:qemu' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
      qemu: ${{ steps.changes.outputs.qemu }}
    steps:
      - name: Select unit test coverage
        id: changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('run', true);
              core.setOutput('qemu', true);
              return;
            }
            const qemu = context.payload.pull_request.labels.some(label => label.name === 'ci:qemu');
            core.setOutput('qemu', qemu);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const required = new Set([
              '.github/scripts/run-unit-tests.sh',
              '.github/scripts/tests/test_unit_test_driver.py',
              '.github/workflows/unit-tests.yaml',
              '.github/workflows/skipped-unit-tests.yaml'
            ]);
            const ignoredDirectories = [
              '.github/', 'dockerfiles/', 'docker_compose/', 'packaging/', 'examples/'
            ];
            const ignoredFiles = new Set(['.gitignore', 'appveyor.yml']);
            const paths = files.flatMap(file => [file.filename, file.previous_filename])
              .filter(Boolean);
            // An empty or truncated API response must not silently skip coverage.
            const run = qemu || files.length === 0 || files.length >= 3000 || paths.some(path =>
              required.has(path) || (!ignoredFiles.has(path) &&
                !ignoredDirectories.some(directory => path.startsWith(directory))));
            core.setOutput('run', run);

  run-ubuntu-unit-tests:
    needs: select-unit-tests
    if: needs.select-unit-tests.outputs.run == 'true'
    name: "${{ startsWith(matrix.flb_option, '-DFLB_SANITIZE_') && 'Linux sanitizer smoke' || 'Linux unit tests' }} (${{ matrix.compiler.cc }}, ${{ matrix.flb_option }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flb_option:
          - "-DFLB_JEMALLOC=On"
          - "-DFLB_JEMALLOC=Off"
          - "-DFLB_SMALL=On"
          - "-DSANITIZE_ADDRESS=On"
          - "-DSANITIZE_UNDEFINED=On"
          - "-DFLB_COVERAGE=On"
          - "-DFLB_SANITIZE_MEMORY=On"
          - "-DFLB_SANITIZE_THREAD=On"
          - "-DFLB_SIMD=On"
          - "-DFLB_SIMD=Off"
          - "-DFLB_ARROW=On"
          - "-DFLB_COMPILER_STRICT_POINTER_TYPES=On"
          - "-DFLB_AVRO_ENCODER=On -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        cmake_version:
          - "3.31.6"
        compiler:
          - gcc:
            cc: gcc
            cxx: g++
          - clang:
            cc: clang
            cxx: clang++
        exclude:
          # MemorySanitizer requires Clang; GCC does not implement it.
          - flb_option: "-DFLB_SANITIZE_MEMORY=On"
            compiler:
              cc: gcc
              cxx: g++
          - flb_option: "-DFLB_COVERAGE=On"
            compiler:
              cc: clang
              cxx: clang++
          - flb_option: "-DFLB_ARROW=On"
            compiler:
              cc: clang
              cxx: clang++
          - flb_option: "-DFLB_COMPILER_STRICT_POINTER_TYPES=On"
            compiler:
              cc: clang
              cxx: clang++
          - flb_option: "-DFLB_AVRO_ENCODER=On -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            compiler:
              cc: clang
              cxx: clang++
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          echo "::group::Disk usage before cleanup"
          df -h
          echo "::endgroup::"

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/lib/jvm || true

          sudo apt-get clean || true

          echo "::group::Disk usage after cleanup"
          df -h
          echo "::endgroup::"

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 clang-12 libsystemd-dev gcovr libyaml-dev libbpf-dev linux-tools-common
          sudo ln -s /usr/bin/llvm-symbolizer-12 /usr/bin/llvm-symbolizer || true

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: "${{ matrix.cmake_version }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check unit-test driver
        run: |
          bash -n .github/scripts/run-unit-tests.sh
          python3 -m unittest discover -s .github/scripts/tests -p test_unit_test_driver.py -v
          python3 -m unittest discover -s tests/runtime/cmake -p test_acutest_discovery.py -v

      - name: Setup Apache Arrow libraries for parquet (-DFLB_ARROW=On Only)
        if: matrix.flb_option == '-DFLB_ARROW=On'
        run: |
          sudo apt-get update
          sudo apt-get install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          sudo apt-get install -y -V libarrow-glib-dev libparquet-glib-dev

      - name: ${{ matrix.compiler.cc }} & ${{ matrix.compiler.cxx }} - ${{ matrix.flb_option }}
        run: |
          echo "CC = $CC, CXX = $CXX, FLB_OPT = $FLB_OPT"
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-12 90
          sudo usermod -a -G systemd-journal $(id -un)
          sudo -E su -p $(id -un) -c "PATH=$PATH bash .github/scripts/run-unit-tests.sh"
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
          FLB_OPT: ${{ matrix.flb_option }}
          # These formerly no-op options now enable real instrumentation. Start
          # with explicit smoke coverage; ordinary/ASan/UBSan jobs run everything.
          FLB_TEST_SCOPE: ${{ startsWith(matrix.flb_option, '-DFLB_SANITIZE_') && 'sanitizer-smoke' || 'full' }}
          CALYPTIA_FLEET_TOKEN: ${{ secrets.CALYPTIA_FLEET_TOKEN }}

      - name: Upload unit-test timings and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-linux-${{ strategy.job-index }}
          path: |
            build/ci-results/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn

  run-macos-unit-tests:
    name: "${{ startsWith(matrix.flb_option, '-DFLB_SANITIZE_') && 'macOS sanitizer smoke' || 'macOS unit tests' }} (${{ matrix.flb_option }})"
    # We chain this after Linux one as there are costs and restrictions associated
    needs:
      - run-ubuntu-unit-tests
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flb_option:
          - "-DFLB_JEMALLOC=Off"
          - "-DFLB_SANITIZE_THREAD=On"
        cmake_version:
          - "3.31.6"
    permissions:
      contents: read
    steps:
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: "${{ matrix.cmake_version }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ${{ matrix.flb_option }}
        run: |
          echo "CC = $CC, CXX = $CXX, FLB_OPT = $FLB_OPT"
          brew update
          brew install bison flex openssl || true
          export FLB_CTEST_REAL_PATH="$(command -v ctest)"
          export PATH="$GITHUB_WORKSPACE/.github/scripts/ctest-wrapper:$PATH"
          bash .github/scripts/run-unit-tests.sh
        env:
          CC: gcc
          CXX: g++
          FLB_OPT: ${{ matrix.flb_option }}
          FLB_TEST_SCOPE: ${{ startsWith(matrix.flb_option, '-DFLB_SANITIZE_') && 'sanitizer-smoke' || 'full' }}

      - name: Upload unit-test timings and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-macos-${{ strategy.job-index }}
          path: |
            build/ci-results/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn

      - name: Upload CTest failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-ctest-logs-${{ matrix.flb_option }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTest.log.tmp
          if-no-files-found: warn

  run-aarch64-unit-tests:
    runs-on: ${{(github.repository == 'fluent/fluent-bit') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    needs:
      - run-ubuntu-unit-tests
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Aarch64 testing"
            flb_option: "-DFLB_WITHOUT_flb-it-network=1 -DFLB_WITHOUT_flb-it-fstore=1"
            omit_option: ""
            global_option: "-DFLB_BACKTRACE=Off -DFLB_SHARED_LIB=Off -DFLB_DEBUG=On -DFLB_ALL=On -DFLB_EXAMPLES=Off"
            unit_test_option: "-DFLB_TESTS_INTERNAL=On"
            compiler_cc: gcc
            compiler_cxx: g++
            cmake_version: "3.31.6"
            cmake_home: "/opt/cmake"

    steps:
      - name: Checkout Fluent Bit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 clang-14 flex bison libsystemd-dev gcovr libyaml-dev libbpf-dev linux-tools-common curl tar gzip
          sudo ln -s /usr/bin/llvm-symbolizer-14 /usr/bin/llvm-symbolizer || true
          sudo mkdir -p "${CMAKE_HOME}"
          cmake_url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-$(uname -m).tar.gz"
          cmake_dist="$(mktemp --suffix ".tar.gz")"
          echo "Downloading CMake ${CMAKE_VERSION}: ${cmake_url} -> ${cmake_dist}"
          curl -jksSL -o "${cmake_dist}" "${cmake_url}"
          echo "Extracting CMake ${CMAKE_VERSION}: ${cmake_dist} -> ${CMAKE_HOME}"
          sudo tar -xzf "${cmake_dist}" -C "${CMAKE_HOME}" --strip-components 1
          rm "${cmake_dist}"
        env:
          CMAKE_HOME: ${{ matrix.config.cmake_home }}
          CMAKE_VERSION: ${{ matrix.config.cmake_version }}

      - name: Build and test with arm runners
        run: |
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 90
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 90
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 90

            export nparallel=$(( $(getconf _NPROCESSORS_ONLN) > 8 ? 8 : $(getconf _NPROCESSORS_ONLN) ))
            export FLB_OPTION="${{ matrix.config.flb_option }}"
            export FLB_OMIT_OPTION="${{ matrix.config.omit_option }}"
            export GLOBAL_OPTION="${{ matrix.config.global_option }}"
            export FLB_UNIT_TEST_OPTION="${{ matrix.config.unit_test_option }}"
            export FLB_OPT="${FLB_OPTION} ${GLOBAL_OPTION} ${FLB_UNIT_TEST_OPTION} ${FLB_OMIT_OPTION}"

            echo "CC = ${{ matrix.config.compiler_cc }}, CXX = ${{ matrix.config.compiler_cxx }}, FLB_OPT = $FLB_OPT"

            if [[ -n "${CMAKE_HOME}" ]]; then
              export PATH="${CMAKE_HOME}/bin:${PATH}"
            fi

            cmake ${FLB_OPT}  ../
            make -j $nparallel
            ctest -j $nparallel --build-run-dir . --output-on-failure
        working-directory: build
        env:
          CC: ${{ matrix.config.compiler_cc }}
          CXX: ${{ matrix.config.compiler_cxx }}
          CALYPTIA_FLEET_TOKEN: ${{ secrets.CALYPTIA_FLEET_TOKEN }}
          CMAKE_HOME: ${{ matrix.config.cmake_home }}

  run-qemu-ubuntu-unit-tests:
    if: needs.select-unit-tests.outputs.qemu == 'true'
    # PRs opt in with ci:qemu; branch pushes and manual runs retain coverage.
    # Run after Linux to avoid expensive emulation when the primary matrix fails.
    needs:
      - select-unit-tests
      - run-ubuntu-unit-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - s390x
          - riscv64
    steps:
      - name: Checkout Fluent Bit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare and build with QEMU ${{ matrix.arch }}
        uses: uraimo/run-on-arch-action@fa1f3e7de95534497266c7265950b5188355fbfb # v3.2.1
        id: build-and-test-on-qemu
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          shell: /bin/bash
          dockerRunArgs: |
            --volume "/var/lib/dbus/machine-id:/var/lib/dbus/machine-id"
            --volume "/etc/machine-id:/etc/machine-id"
          install: |
            apt-get update
            apt-get install -y gcc-12 g++-12 libyaml-dev flex bison libssl-dev libbpf-dev linux-tools-common
            arch="$(dpkg --print-architecture)"
            case "$arch" in
              riscv64)
                apt-get install -y gcc-12 g++-12 libyaml-dev flex bison libssl-dev \
                                   libbpf-dev linux-tools-common lld-15
                update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-15 50
                ;;
              *)
                ;;
            esac
            apt-get satisfy -y cmake "cmake (<< 4.0)"

            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 90
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 90
          run: |
            cd build
            export nparallel=$(( $(getconf _NPROCESSORS_ONLN) > 8 ? 8 : $(getconf _NPROCESSORS_ONLN) ))
            export CMAKE_LINKER_OPTION=""
            arch="$(dpkg --print-architecture)"
            case "$arch" in
              riscv64)
                export CMAKE_LINKER_OPTION='-DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"'
                ;;
              *)
                ;;
            esac
            export FLB_OPTION="-DFLB_WITHOUT_flb-it-network=1 -DFLB_WITHOUT_flb-it-fstore=1"
            export FLB_OMIT_OPTION=""
            export GLOBAL_OPTION="-DFLB_BACKTRACE=Off -DFLB_SHARED_LIB=Off -DFLB_DEBUG=On -DFLB_ALL=On -DFLB_EXAMPLES=Off"
            export FLB_UNIT_TEST_OPTION="-DFLB_TESTS_INTERNAL=On"
            export FLB_OPT="${FLB_OPTION} ${GLOBAL_OPTION} ${FLB_UNIT_TEST_OPTION} ${FLB_OMIT_OPTION}"
            export CC=gcc
            export CXX=g++

            echo "CC = $CC, CXX = $CXX, FLB_OPT = $FLB_OPT"

            cmake ${CMAKE_LINKER_OPTION} ${FLB_OPT}  ../
            make -j $nparallel
            ctest -j $nparallel --build-run-dir . --output-on-failure

  # Required check looks at this so do not remove
  run-all-unit-tests:
    if: always() && needs.select-unit-tests.result != 'skipped'
    runs-on: ubuntu-latest
    # Unrelated labels must not replace the required check with a skipped result.
    name: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:qemu' && 'Unit tests (unrelated label)' || 'Unit tests (matrix)' }}
    permissions:
      contents: none
    needs:
      - select-unit-tests
      - run-macos-unit-tests
      - run-ubuntu-unit-tests
      - run-aarch64-unit-tests
      - run-qemu-ubuntu-unit-tests
    steps:
      - name: Check build matrix status
        # Ignore MacOS failures
        if: ${{ needs.select-unit-tests.result != 'success' || (needs.select-unit-tests.outputs.run == 'true' && needs.run-ubuntu-unit-tests.result != 'success') || (needs.select-unit-tests.outputs.qemu == 'true' && needs.run-qemu-ubuntu-unit-tests.result != 'success') }}
        run: exit 1
