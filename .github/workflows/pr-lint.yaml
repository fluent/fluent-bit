name: Lint PRs
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint-pr:
    runs-on: ubuntu-latest
    name: PR - Hadolint
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint
        uses: reviewdog/action-hadolint@9d9a44af664599d7fe5ed5ee3d66d2d236cb7f8f # v1.54.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: "warning"
          reporter: github-pr-review # Better annotation in PRs
          exclude: |
            packaging/testing/smoke/packages/Dockerfile.*

  shellcheck-pr:
    runs-on: ubuntu-latest
    name: PR - Shellcheck
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@a94d585085f1f5215ae65f4de34e7bbd0523d550 # v1.33.0
        with:
          github_token: ${{ secrets.github_token }}
          fail_level: "warning"
          reporter: github-pr-review # Better annotation in PRs
          exclude: |
            */.git/*
            ./cmake/sanitizers-cmake/**
            ./lib/**
            ./plugins/**
            ./tests/**

  actionlint-pr:
    runs-on: ubuntu-latest
    name: PR - Actionlint
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          # Disable shellcheck as done elsewhere and speeds up process
          actionlint_flags: -shellcheck=
          fail_level: "warning"
          reporter: github-pr-review # Better annotation in PRs
          github_token: ${{ secrets.github_token }}
