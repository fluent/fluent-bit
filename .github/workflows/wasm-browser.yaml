name: Browser WebAssembly

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version release to build and attach the experimental SDK to
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  release:
    types: [published]
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: wasm-browser-${{ inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'wasm-browser-')
    runs-on: ubuntu-24.04
    outputs:
      supported: ${{ steps.source.outputs.supported }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      build_sha: ${{ steps.source.outputs.build_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Resolve browser source
        id: source
        shell: bash
        env:
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Expected a version release tag'
            exit 1
          fi
          flb_build_sha=$(git rev-parse HEAD)
          echo "build_sha=$flb_build_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=${PR_SOURCE_SHA:-$flb_build_sha}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ -f .emscripten-version && -f cmake/wasm-sdk.cmake ]]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo 'This release predates the browser SDK; no WASM assets will be published.'
          else
            echo '::error::Browser SDK sources are missing'
            exit 1
          fi

  wasm:
    needs: prepare
    if: needs.prepare.outputs.supported == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.build_sha }}
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake make flex bison perl pkg-config
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flb-emsdk"
          git -C "$RUNNER_TEMP/flb-emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/flb-emsdk" fetch --depth=1 origin 5eb0bde7585670252e8ba05e9d361627bffd08b5
          git -C "$RUNNER_TEMP/flb-emsdk" checkout --detach FETCH_HEAD
          read -r flb_sdk_version < .emscripten-version
          "$RUNNER_TEMP/flb-emsdk/emsdk" install "$flb_sdk_version"
          "$RUNNER_TEMP/flb-emsdk/emsdk" activate "$flb_sdk_version"
      - name: Build and test
        shell: bash
        env:
          FLB_SANITIZER: ${{ matrix.sanitizer }}
        run: |
          source "$RUNNER_TEMP/flb-emsdk/emsdk_env.sh"
          set -euo pipefail
          flb_cmake_flags=()
          if [[ "$FLB_SANITIZER" == address ]]; then
            flb_cmake_flags+=(-DLIBCO_TESTS_ASAN=ON -DCMAKE_C_FLAGS=-fsanitize=address
              '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -sALLOW_MEMORY_GROWTH=1')
          fi
          emcmake cmake -S . -B build-wasm -DFLB_WASM_BROWSER=ON \
            -DFLB_DEBUG=OFF -DFLB_RELEASE=OFF -DCMAKE_BUILD_TYPE=MinSizeRel "${flb_cmake_flags[@]}"
          cmake --build build-wasm -j8
          ctest --test-dir build-wasm --output-on-failure
          node --test tests/wasm/sdk_unit_test.mjs tests/wasm/sdk_worker_unit_test.mjs
      - name: Package experimental browser SDK
        if: matrix.sanitizer == 'none'
        shell: bash
        env:
          FLB_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          FLB_BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
        run: |
          set -euo pipefail
          flb_package="fluent-bit-browser-experimental"
          mkdir -p "dist/$flb_package"
          cp -a build-wasm/sdk/browser/. "dist/$flb_package/"
          test -s "dist/$flb_package/fluent-bit-runtime.wasm"
          test -s "dist/$flb_package/fluent-bit-runtime.js"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          metadata = {
              "experimental": True,
              "source_commit": os.environ["FLB_SOURCE_SHA"],
              "build_commit": os.environ["FLB_BUILD_SHA"],
              "emscripten": Path(".emscripten-version").read_text().strip(),
              "sanitizer": "none",
              "validation": "Build, CTest and SDK unit tests passed; browser job status is separate",
              "requirements": "HTTPS and cross-origin isolation (COOP/COEP)"
          }
          Path("dist/fluent-bit-browser-experimental/build-info.json").write_text(
              json.dumps(metadata, indent=2) + "\n")
          PYTHON
          (cd "dist/$flb_package" && sha256sum -- *.js *.wasm *.d.ts package.json \
            README.md LICENSE build-info.json > SHA256SUMS)
          tar -czf "dist/$flb_package.tar.gz" -C dist "$flb_package"
          (cd dist && sha256sum "$flb_package.tar.gz" > "$flb_package.tar.gz.sha256")
      - name: Upload experimental browser SDK
        if: matrix.sanitizer == 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluent-bit-browser-experimental-${{ needs.prepare.outputs.source_sha }}
          path: |
            dist/fluent-bit-browser-experimental.tar.gz
            dist/fluent-bit-browser-experimental.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Test browser lifecycle and startup failures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/flb-browser-tests"
          "$RUNNER_TEMP/flb-browser-tests/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/flb-browser-tests/bin/python" -m playwright install --with-deps chromium
          flb_browser=$("$RUNNER_TEMP/flb-browser-tests/bin/python" -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          "$RUNNER_TEMP/flb-browser-tests/bin/python" tests/wasm/sdk_test.py \
            --build-dir build-wasm --browser "$flb_browser"
          "$RUNNER_TEMP/flb-browser-tests/bin/python" tests/wasm/sdk_test.py \
            --build-dir build-wasm --browser "$flb_browser" --pthread-only
          "$RUNNER_TEMP/flb-browser-tests/bin/python" tests/wasm/browser_page_test.py \
            --build-dir build-wasm --browser "$flb_browser"

      - name: Test the packaged SDK as a Studio deployment
        if: matrix.sanitizer == 'none'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c fluent-bit-browser-experimental.tar.gz.sha256)
          mkdir -p "$RUNNER_TEMP/flb-studio/sdk/browser"
          tar -xzf dist/fluent-bit-browser-experimental.tar.gz \
            --strip-components=1 -C "$RUNNER_TEMP/flb-studio/sdk/browser"
          (cd "$RUNNER_TEMP/flb-studio/sdk/browser" && sha256sum -c SHA256SUMS)
          flb_browser=$("$RUNNER_TEMP/flb-browser-tests/bin/python" -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          "$RUNNER_TEMP/flb-browser-tests/bin/python" tests/wasm/sdk_test.py \
            --build-dir "$RUNNER_TEMP/flb-studio" --browser "$flb_browser" --fts-only

  release-payload:
    needs: [prepare, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fluent-bit-browser-experimental-${{ needs.prepare.outputs.source_sha }}
          path: incoming
      - name: Test release payload validation and publication gates
        run: |
          python3 -m venv "$RUNNER_TEMP/flb-release-tests"
          "$RUNNER_TEMP/flb-release-tests/bin/python" -m pip install PyYAML==6.0.3
          "$RUNNER_TEMP/flb-release-tests/bin/python" -m unittest discover \
            -s .github/scripts/tests -p 'test_wasm_release.py' -v
          "$RUNNER_TEMP/flb-release-tests/bin/python" -m unittest discover \
            -s .github/scripts/tests -p 'test_release_workflows.py' -v
      - name: Verify and prepare immutable release assets
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/wasm_release.py --directory incoming --output release-assets \
            --source-sha "$SOURCE_SHA" --build-sha "$BUILD_SHA" \
            --release-tag "$RELEASE_TAG" --run-url "$RUN_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluent-bit-browser-validated-${{ needs.prepare.outputs.source_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [prepare, release-payload]
    if: >-
      github.repository == 'fluent/fluent-bit' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name != 'pull_request' && needs.prepare.outputs.release_tag != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fluent-bit-browser-validated-${{ needs.prepare.outputs.source_sha }}
          path: release-assets
      - name: Require an existing version release
        if: needs.prepare.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release view "$RELEASE_TAG"
      - name: Publish experimental master snapshot
        if: needs.prepare.outputs.release_tag == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: wasm-browser-${{ needs.prepare.outputs.source_sha }}
          target_commitish: ${{ needs.prepare.outputs.build_sha }}
          name: Experimental browser SDK ${{ needs.prepare.outputs.source_sha }}
          body: |
            Experimental browser SDK from master. Optimized and ASan browser validation passed.
            Validation: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Download the archive, verify its checksum, and deploy the complete SDK on your application origin.
            HTTPS and COOP/COEP are required. This is not a production support promise.
          prerelease: true
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Attach experimental SDK to version release
        if: needs.prepare.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          mkdir existing
          for flb_asset in release-assets/*; do
            flb_name=$(basename "$flb_asset")
            if grep -Fxq -- "$flb_name" existing-assets.txt; then
              gh release download "$RELEASE_TAG" --pattern "$flb_name" --dir existing
              cmp "$flb_asset" "existing/$flb_name"
            else
              gh release upload "$RELEASE_TAG" "$flb_asset"
            fi
          done
      - name: Verify the published files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag || format('wasm-browser-{0}', needs.prepare.outputs.source_sha) }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'fluent-bit-browser-experimental-*' --dir downloaded
          for flb_asset in release-assets/*; do
            cmp "$flb_asset" "downloaded/$(basename "$flb_asset")"
          done
