# Local suppression: state is volatile and does not acknowledge delivery.
# Replace dummy with the real source; obtain trusted_tenant from trusted metadata.
service:
  flush: 1
  grace: 1
pipeline:
  inputs:
    - name: dummy
      tag: example.dedupe
      samples: 5
      dummy: '{"trusted_tenant":"demo","event_id":"event-1","message":"repeated event","password":"synthetic-only"}'
      processors:
        logs:
          - name: fts
            context: native
            error_mode: drop
            state_commit: local
            state_limit: 1M
            recipe:
              - id: privacy
                use: shared.redact_keys
                with:
                  targets: [{root: body, path: []}]
                  keys: [password, authorization]
              - id: duplicates
                use: logs.dedupe
                with:
                  tenant: {root: body, path: [trusted_tenant]}
                  keys: [{root: body, path: [event_id]}]
                  ttl_ms: 60000
                  max_keys: 1024
                  max_key_bytes: 1024
                  on_missing: error
                  overflow: keep
  outputs:
    - name: stdout
      match: example.dedupe
      format: json_lines
